name: Build Photo Gallery

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq

      - name: Generate thumbnails
        run: |
          mkdir -p thumbs

          find photos -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
            | while read img
          do
            filename=$(basename "$img")
            base="${filename%.*}"

            convert "$img" \
              -auto-orient \
              -strip \
              -resize '400x400>' \
              -quality 75 \
              "thumbs/${base}.webp"
          done

          echo "Generated thumbnails:"
          ls -la thumbs

      - name: Create photos.json
        run: |
          find photos -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
            | sed 's#photos/##' \
            | sort -r \
            | jq -R -s -c 'split("\n")[:-1]' \
            > photos.json

          echo "photos.json:"
          cat photos.json

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add thumbs photos.json

          if ! git diff --cached --quiet; then
            git commit -m "Update gallery"
            git push
          else
            echo "Nothing to commit."
          fi
