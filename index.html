<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skøyen Photo Album</title>

<style>

:root{
    --radius:12px;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f4f6;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px;
}

header h1{
    margin:0;
}

#counter{
    margin-top:10px;
    color:#d1d5db;
}

.gallery{
    padding:20px;
    columns:4 250px;
    column-gap:15px;
}

.card{
    break-inside:avoid;
    background:white;
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.13);
}

.card img{
    width:100%;
    display:block;
    cursor:pointer;
}

.caption{
    padding:10px;
    text-align:center;
    font-size:0.85rem;
}

/* LIGHTBOX */

#lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    z-index:9999;
}

#lightbox img{
    max-width:95vw;
    max-height:90vh;
}

.lightbox-wrapper{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.control{
    position:absolute;
    color:white;
    font-size:2rem;
    cursor:pointer;
    user-select:none;
}

#prev{
    top:50%;
    left:20px;
}

#next{
    top:50%;
    right:20px;
}

#close{
    top:15px;
    right:20px;
}

#download{
    position:absolute;
    bottom:20px;
    right:20px;

    background:white;
    color:black;

    text-decoration:none;
    border-radius:8px;

    padding:10px 18px;

    font-weight:bold;
}

#filename{
    position:absolute;
    bottom:20px;
    left:20px;
    color:white;
}

@media(max-width:768px){

    .gallery{
        columns:2 180px;
    }

}

@media(max-width:480px){

    .gallery{
        columns:1;
    }

}

</style>
</head>

<body>

<header>
    <h1>📸 Skøyen Photo Album</h1>
    <div id="counter">Loading photos...</div>
</header>

<div class="gallery" id="gallery"></div>

<div id="lightbox">

    <div id="close" class="control">✕</div>
    <div id="prev" class="control">❮</div>
    <div id="next" class="control">❯</div>

    <div class="lightbox-wrapper">
        <img id="lightbox-img">
    </div>

    <div id="filename"></div>

    <a id="download" download>
        Download original
    </a>

</div>

<script>

let photos = [];
let currentIndex = 0;

async function loadGallery(){

    const response = await fetch("./photos.json");

    photos = await response.json();

    document.getElementById("counter").textContent =
        `${photos.length} photos`;

    const gallery = document.getElementById("gallery");

    photos.forEach((file,index)=>{

        const thumb =
            file.replace(/\.[^/.]+$/, ".webp");

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <img
                src="thumbs/${thumb}"
                loading="lazy"
                alt="${file}">
            <div class="caption">${file}</div>
        `;

        card.querySelector("img")
            .addEventListener(
                "click",
                () => openLightbox(index)
            );

        gallery.appendChild(card);

    });

}

function openLightbox(index){

    currentIndex = index;

    const file = photos[index];

    document.getElementById("lightbox-img").src =
        `photos/${file}`;

    document.getElementById("filename").textContent =
        file;

    document.getElementById("download").href =
        `photos/${file}`;

    document.getElementById("download").download =
        file;

    document.getElementById("lightbox").style.display =
        "block";
}

function nextImage(){

    currentIndex =
        (currentIndex + 1) % photos.length;

    openLightbox(currentIndex);
}

function previousImage(){

    currentIndex =
        (currentIndex - 1 + photos.length)
        % photos.length;

    openLightbox(currentIndex);
}

document.getElementById("next")
    .addEventListener("click",nextImage);

document.getElementById("prev")
    .addEventListener("click",previousImage);

document.getElementById("close")
    .addEventListener(
        "click",
        () =>
        document.getElementById("lightbox")
            .style.display="none"
    );

document.addEventListener("keydown",(e)=>{

    if(
        document.getElementById("lightbox")
            .style.display !== "block"
    ) return;

    if(e.key==="ArrowRight")
        nextImage();

    if(e.key==="ArrowLeft")
        previousImage();

    if(e.key==="Escape")
        document.getElementById("lightbox")
            .style.display="none";
});

loadGallery();

</script>

</body>
</html>
